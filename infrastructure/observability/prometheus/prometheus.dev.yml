global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nestly-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: nestly-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9101']
