groups:
  - name: nestly-api-alerts
    rules:
      - alert: ElevatedHttp5xxRate
        expr: >
          (sum(rate(nestly_http_requests_total{status_class="5xx"}[5m]))
          / clamp_min(sum(rate(nestly_http_requests_total[5m])), 1e-6)) > 0.05
          and sum(rate(nestly_http_requests_total{status_class="5xx"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Elevated HTTP 5xx error rate on Nestly API
          description: More than 5% of API requests are returning 5xx responses over the last 5 minutes.

      - alert: HighHttpP95Latency
        expr: >
          histogram_quantile(
            0.95,
            sum by (le) (rate(nestly_http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: API P95 latency exceeds 1s budget
          description: P95 HTTP request latency across API routes exceeded 1.0s over 5 minutes.

      - alert: DbPoolWaitingClients
        expr: max by (job, instance) (nestly_db_pool_connections{state="waiting"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connection pool has waiting clients
          description: Process {{ $labels.job }} ({{ $labels.instance }}) has requests waiting for a Postgres connection.

  - name: nestly-async-and-payments-alerts
    rules:
      - alert: SqsDlqNotEmpty
        expr: max by (queue) (nestly_sqs_dlq_depth) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Messages present in SQS Dead Letter Queue {{ $labels.queue }}
          description: Queue {{ $labels.queue }} DLQ depth is {{ $value }} (poison or failed consumer deliveries).

      - alert: OutboxUnpublishedLagHigh
        expr: max(nestly_outbox_oldest_unpublished_age_seconds) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Outbox publisher lagging behind
          description: Oldest unpublished outbox row is {{ $value }}s old (> 60s).

      - alert: HighWorkerMessageAge
        expr: >
          histogram_quantile(
            0.95,
            sum by (queue, le) (rate(nestly_worker_message_age_seconds_bucket[5m]))
          ) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High worker message age on queue {{ $labels.queue }}
          description: P95 SQS message age at processing start exceeded 30s on {{ $labels.queue }}.

      - alert: PaymentsStuckProcessing
        expr: max(nestly_payments_stuck_processing_count) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Payments stuck in PROCESSING state
          description: There are {{ $value }} payments stuck in PROCESSING beyond reconciliation threshold.

      - alert: SagasStaleNonTerminal
        expr: max(nestly_sagas_stale_non_terminal_count) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Stale non-terminal booking sagas detected
          description: There are {{ $value }} non-terminal sagas stuck beyond stale threshold.

  - name: nestly-dependencies-and-targets
    rules:
      - alert: RedisDependencyDown
        expr: max by (dependency) (nestly_dependency_up{dependency="redis"}) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Redis dependency unreachable (cache/locks degraded)
          description: Collector health probe reports Redis is down; API falls back to degraded non-cached/DB behavior.

      - alert: SearchDependencyDown
        expr: max by (dependency) (nestly_dependency_up{dependency="opensearch"}) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: OpenSearch dependency unreachable (search degraded)
          description: Collector health probe reports OpenSearch is down; API searches are falling back to PostgreSQL.

      - alert: CoreDependencyDown
        expr: max by (dependency) (nestly_dependency_up{dependency=~"postgres|elasticmq|minio"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Core dependency {{ $labels.dependency }} unreachable
          description: Collector health probe reports {{ $labels.dependency }} is down.

      - alert: TargetDown
        expr: min by (job, instance) (up) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down
          description: Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}.
