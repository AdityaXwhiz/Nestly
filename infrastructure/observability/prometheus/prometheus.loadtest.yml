global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nestly-api
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 9100

  - job_name: nestly-worker-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ['worker-scheduler:9101']

  - job_name: nestly-worker-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ['worker-consumer:9101']
