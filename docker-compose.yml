services:
  postgres:
    image: postgres:16
    container_name: nestly-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nestly
      POSTGRES_PASSWORD: nestly_dev
      POSTGRES_DB: nestly
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestly']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: nestly-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
