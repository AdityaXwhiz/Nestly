services:
  postgres:
    image: postgres:16
    container_name: nestly-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: nestly
      POSTGRES_PASSWORD: nestly_dev
      POSTGRES_DB: nestly
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestly']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: nestly-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.12
    container_name: nestly-elasticmq
    restart: unless-stopped
    ports:
      - '9324:9324'
      - '9325:9325'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:9324/?Action=ListQueues']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/minio:latest
    container_name: nestly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: nestly_local_key
      MINIO_ROOT_PASSWORD: nestly_local_secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: nestly-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Security plugin disabled for LOCAL development only; production AWS OpenSearch uses VPC private subnets, security groups, and IAM.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health?local=true']
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: nestly-prometheus-dev
    profiles: ['observability']
    restart: unless-stopped
    mem_limit: 512m
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - '--config.file=/etc/prometheus/prometheus.dev.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.dev.yml:ro
      - ./infrastructure/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - dev_prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: nestly-grafana-dev
    profiles: ['observability']
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-nestly_dev_grafana}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - dev_grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3002:3000'
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
  opensearch_data:
  dev_prometheus_data:
  dev_grafana_data:
